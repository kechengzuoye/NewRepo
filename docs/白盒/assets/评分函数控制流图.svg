<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .node   { fill: #F9FAFB; stroke: #6B7280; stroke-width: 1.4; }
      .dec    { fill: #EEF2FF; stroke: #4F46E5; stroke-width: 1.6; }
      .se     { fill: #ECFDF5; stroke: #059669; stroke-width: 1.6; }
      .txt    { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 13px; fill: #111827; text-anchor: middle; }
      .txt-s  { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 12px; fill: #111827; text-anchor: middle; }
      .code   { font-family: Consolas, "Courier New", monospace; font-size: 12.5px; fill: #111827; text-anchor: middle; }
      .tag    { font-family: "Segoe UI", sans-serif; font-size: 11px; fill: #9CA3AF; text-anchor: middle; }
      .edge   { stroke: #374151; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .wire   { stroke: #374151; stroke-width: 1.4; fill: none; }
      .lbl    { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 12px; fill: #374151; text-anchor: middle; }
      .path   { font-family: "Segoe UI", sans-serif; font-size: 11px; fill: #2563EB; text-anchor: middle; }
      .legend { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 12px; fill: #4B5563; text-anchor: start; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="720" fill="#FFFFFF"/>

  <!-- ========== 节点 ========== -->
  <!-- N1 入口 -->
  <rect class="se" x="370" y="20" width="160" height="44" rx="22"/>
  <text class="code" x="450" y="47">getScoreColor(score)</text>
  <text class="tag" x="352" y="47">N1</text>

  <!-- D1 判定 -->
  <polygon class="dec" points="450,80 610,130 450,180 290,130"/>
  <text class="code" x="450" y="124">score === undefined</text>
  <text class="code" x="450" y="144">|| score === null ?</text>
  <text class="tag" x="274" y="104">D1</text>

  <!-- D2 判定 -->
  <polygon class="dec" points="450,225 610,275 450,325 290,275"/>
  <text class="code" x="450" y="280">score &gt;= 80 ?</text>
  <text class="tag" x="274" y="249">D2</text>

  <!-- D3 判定 -->
  <polygon class="dec" points="450,370 610,420 450,470 290,420"/>
  <text class="code" x="450" y="425">score &gt;= 60 ?</text>
  <text class="tag" x="274" y="394">D3</text>

  <!-- N8 兜底返回 -->
  <rect class="node" x="310" y="515" width="280" height="46"/>
  <text class="code" x="450" y="543">return 'text-destructive'</text>
  <text class="tag" x="292" y="558">N8</text>

  <!-- 出口 -->
  <rect class="se" x="370" y="610" width="160" height="44" rx="22"/>
  <text class="txt" x="450" y="637">出口（返回调用处）</text>
  <text class="tag" x="352" y="637">N9</text>

  <!-- 返回节点 R1 R2 R3 -->
  <rect class="node" x="620" y="108" width="210" height="44"/>
  <text class="txt-s" x="725" y="135">return ''（无颜色）</text>
  <text class="tag" x="606" y="135">R1</text>

  <rect class="node" x="620" y="253" width="210" height="44"/>
  <text class="code" x="725" y="280">return 'text-emerald-600'</text>
  <text class="tag" x="606" y="280">R2</text>

  <rect class="node" x="620" y="398" width="210" height="44"/>
  <text class="code" x="725" y="425">return 'text-amber-500'</text>
  <text class="tag" x="606" y="425">R3</text>

  <!-- ========== 边 ========== -->
  <line class="edge" x1="450" y1="64"  x2="450" y2="76"/>
  <line class="edge" x1="610" y1="130" x2="616" y2="130"/>
  <line class="edge" x1="450" y1="180" x2="450" y2="221"/>
  <line class="edge" x1="610" y1="275" x2="616" y2="275"/>
  <line class="edge" x1="450" y1="325" x2="450" y2="366"/>
  <line class="edge" x1="610" y1="420" x2="616" y2="420"/>
  <line class="edge" x1="450" y1="470" x2="450" y2="511"/>
  <line class="edge" x1="450" y1="561" x2="450" y2="606"/>

  <!-- 返回节点汇入出口 -->
  <polyline class="wire" points="725,152 725,168 860,168"/>
  <polyline class="wire" points="725,297 725,313 860,313"/>
  <polyline class="wire" points="725,442 725,458 860,458"/>
  <polyline class="edge" points="860,168 860,632 534,632"/>

  <!-- 汇合干线 -->
  <line x1="860" y1="168" x2="860" y2="632" stroke="#374151" stroke-width="1.4"/>

  <!-- ========== 边标签 ========== -->
  <text class="lbl" x="485" y="203">否</text>
  <text class="lbl" x="601" y="121">是</text>
  <text class="lbl" x="485" y="348">否</text>
  <text class="lbl" x="601" y="266">是</text>
  <text class="lbl" x="485" y="493">否</text>
  <text class="lbl" x="601" y="411">是</text>

  <!-- ========== 独立路径标注 ========== -->
  <text class="path" x="548" y="112">P1</text>
  <text class="path" x="548" y="257">P2</text>
  <text class="path" x="548" y="402">P3</text>
  <text class="path" x="424" y="498">P4</text>

  <!-- ========== 图例 ========== -->
  <text class="legend" x="30" y="690">图例：菱形 = 判定；矩形 = 语句 / 返回；圆角 = 入口 / 出口。N = 9，E = 11，圈复杂度 V(G) = E − N + 2 = 4，独立路径 P1–P4。</text>
</svg>
