<svg xmlns="http://www.w3.org/2000/svg" width="920" height="820" viewBox="0 0 920 820">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .proc { fill: #F9FAFB; stroke: #6B7280; stroke-width: 1.4; }
      .dec  { fill: #EEF2FF; stroke: #4F46E5; stroke-width: 1.6; }
      .se   { fill: #ECFDF5; stroke: #059669; stroke-width: 1.6; }
      .good { fill: #ECFDF5; stroke: #059669; stroke-width: 1.4; }
      .warn { fill: #FFFBEB; stroke: #D97706; stroke-width: 1.4; }
      .bad  { fill: #FEF2F2; stroke: #DC2626; stroke-width: 1.4; }
      .none { fill: #F3F4F6; stroke: #6B7280; stroke-width: 1.4; }
      .t    { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 14px; fill: #111827; text-anchor: middle; }
      .t12  { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 12.5px; fill: #111827; text-anchor: middle; }
      .tag  { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 11px; fill: #6B7280; text-anchor: middle; }
      .edge { stroke: #374151; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .wire { stroke: #374151; stroke-width: 1.4; fill: none; }
      .lbl  { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 12.5px; fill: #374151; text-anchor: middle; }
      .legend { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 12px; fill: #4B5563; text-anchor: start; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="820" fill="#FFFFFF"/>

  <!-- 开始 -->
  <ellipse class="se" cx="300" cy="45" rx="85" ry="23"/>
  <text class="t" x="300" y="50">开始</text>

  <!-- 读取分数 -->
  <rect class="proc" x="150" y="92" width="300" height="56" rx="6"/>
  <text class="t" x="300" y="117">读取匹配分数</text>
  <text class="tag" x="300" y="136">来自报告中的综合匹配度</text>

  <!-- 判定一：分数未提供？ -->
  <polygon class="dec" points="300,175 460,225 300,275 140,225"/>
  <text class="t12" x="300" y="230">分数未提供？</text>

  <!-- 结果一：无等级 -->
  <rect class="none" x="610" y="193" width="260" height="64" rx="6"/>
  <text class="t12" x="740" y="219">无等级：不显示颜色</text>
  <text class="tag" x="740" y="241">路径一</text>

  <!-- 判定二：不低于八十分？ -->
  <polygon class="dec" points="300,310 470,360 300,410 130,360"/>
  <text class="t12" x="300" y="365">分数不低于 80 分？</text>

  <!-- 结果二：高匹配 -->
  <rect class="good" x="610" y="328" width="260" height="64" rx="6"/>
  <text class="t12" x="740" y="354">高匹配：绿色显示</text>
  <text class="tag" x="740" y="376">路径二</text>

  <!-- 判定三：不低于六十分？ -->
  <polygon class="dec" points="300,445 470,495 300,545 130,495"/>
  <text class="t12" x="300" y="500">分数不低于 60 分？</text>

  <!-- 结果三：中匹配 -->
  <rect class="warn" x="610" y="463" width="260" height="64" rx="6"/>
  <text class="t12" x="740" y="489">中匹配：琥珀色显示</text>
  <text class="tag" x="740" y="511">路径三</text>

  <!-- 结果四：低匹配 -->
  <rect class="bad" x="150" y="572" width="300" height="56" rx="6"/>
  <text class="t12" x="300" y="598">低匹配：红色显示</text>
  <text class="tag" x="300" y="616">路径四</text>

  <!-- 结束 -->
  <ellipse class="se" cx="300" cy="700" rx="85" ry="23"/>
  <text class="t" x="300" y="705">结束</text>

  <!-- 主流程连线 -->
  <line class="edge" x1="300" y1="68"  x2="300" y2="90"/>
  <line class="edge" x1="300" y1="148" x2="300" y2="173"/>
  <line class="edge" x1="300" y1="275" x2="300" y2="308"/>
  <line class="edge" x1="300" y1="410" x2="300" y2="443"/>
  <line class="edge" x1="300" y1="545" x2="300" y2="570"/>
  <line class="edge" x1="300" y1="628" x2="300" y2="675"/>

  <!-- 判定到结果的连线 -->
  <line class="edge" x1="460" y1="225" x2="608" y2="225"/>
  <line class="edge" x1="470" y1="360" x2="608" y2="360"/>
  <line class="edge" x1="470" y1="495" x2="608" y2="495"/>

  <!-- 右侧结果汇入结束 -->
  <polyline class="wire" points="870,225 890,225"/>
  <polyline class="wire" points="870,360 890,360"/>
  <polyline class="wire" points="870,495 890,495"/>
  <polyline class="edge" points="890,225 890,700 387,700"/>

  <!-- 边标签 -->
  <text class="lbl" x="315" y="296">否</text>
  <text class="lbl" x="315" y="431">否</text>
  <text class="lbl" x="315" y="563">否</text>
  <text class="lbl" x="534" y="215">是</text>
  <text class="lbl" x="540" y="350">是</text>
  <text class="lbl" x="540" y="485">是</text>

  <!-- 图例 -->
  <text class="legend" x="30" y="790">说明：三个判定自上而下依次执行，命中即结束；路径一至路径四与白盒测试的四条覆盖路径一一对应。</text>
</svg>
